# /etc/systemd/system/smoktolk-bot.service.d/20-resources.conf
# Защита бота от OOM-killer хоста и ограничение его собственного аппетита
# к памяти/swap. Не пересекается с 10-alerts.conf (рестарты/алерты).
#
# Базовая линия на момент применения: VmRSS≈282 МБ, MemoryCurrent≈290 МБ.
# Хост: 970 МБ RAM + 2 ГБ swap.

[Service]
# === Защита от host-wide OOM ===
# Снижает /proc/$PID/oom_score примерно с 727 до ~227.
# При общем давлении ядро убьёт сначала фоновые процессы (ops-agent,
# бэкап-скрипты), а не критичный сервис. Диапазон: -1000..1000.
OOMScoreAdjust=-500

# === Поведение при cgroup-OOM ===
# kill: при превышении MemoryMax systemd убивает всю cgroup сразу.
# Чище логи, нет зомби-состояний, Restart=always (из 10-alerts.conf)
# поднимает бота через RestartSec=5.
OOMPolicy=kill

# === Лимиты памяти ===
# Soft-throttle. При превышении ядро активно вытесняет страницы бота
# в swap, замедляя его — это сигнал, но не смерть. Запас ~2x от текущих 290M.
MemoryHigh=500M

# Hard-kill. При превышении сработает cgroup-OOM (OOMPolicy=kill).
# 700M бот + ~270M остальные процессы = 970M RAM хоста. Swap (2G) страхует.
# Защищает хост от утечки бота, не задушив его при разумных пиках.
MemoryMax=700M

# Лимит swap для бота. Бот — latency-sensitive (Telegram long polling),
# swap медленный. Если >200M в swap — лучше перезапуск, чем просадки.
MemorySwapMax=200M

# === Защита от форк-бомбы ===
# Бот однопоточный async, дефолт 1071 избыточен. 512 = большой запас
# для legitimate-нагрузки + защита при багах/уязвимостях.
TasksMax=512
