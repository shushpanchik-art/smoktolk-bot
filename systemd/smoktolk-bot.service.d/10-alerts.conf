[Service]
# === Стратегия рестарта ===
Restart=always
RestartSec=5
StartLimitBurst=0

# === Runtime-директория для state-файла крэша ===
# systemd создаёт /run/smoktolk-bot/ с владельцем=User юнита (smoktolk),
# права 0750. Preserve=yes — НЕ удалять директорию между рестартами,
# чтобы state-файл переживал перезапуск.
# Скрипт notify_admin.sh (от root) пишет туда; бот (от smoktolk) удаляет.
RuntimeDirectory=smoktolk-bot
RuntimeDirectoryMode=0775
RuntimeDirectoryPreserve=yes

# === DOWN-уведомление ===
# Только при ненулевом exit. Скрипт сам блокирует дубликаты через
# /run/smoktolk-bot/crashed. Префикс '+' = от root (для записи).
ExecStopPost=+/bin/sh -c 'if [ "$SERVICE_RESULT" != "success" ]; then /opt/smoktolk/bot/scripts/notify_admin.sh down; fi'

# === RECOVERED-уведомление ===
# Шлёт сам Python-бот в bot.py через crash_alert.notify_recovered_if_needed()
# после успешной инициализации (init_db, get_me, catalog).

[Unit]
OnFailure=smoktolk-bot-alert.service
